    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      // Ignore benign HMR WebSocket connection closures in preview iframe environment
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && e.message.includes('WebSocket')) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#0B1130] text-[#F4F6FF] antialiased selection:bg-[#3B82F6]/30 selection:text-[#F4F6FF] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
